name: Deploy to AWS (EC2)

# Ships the checked-out tree to the EC2 box and runs the blue-green deploy
# script that already lives there (~/run-deploy.sh): prune → build → typecheck →
# migrate → schema guard → start the idle colour → health-check → stop the old
# colour. A failed deploy leaves the previous colour serving, so it cannot take
# the site down.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_HOST   EC2 public IP / DNS        e.g. 13.204.102.20
#   DEPLOY_SSH_USER   ssh user                   e.g. ec2-user
#   DEPLOY_SSH_KEY    the PRIVATE key (PEM), full file including the BEGIN/END lines
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#                     IAM user allowed to ec2:AuthorizeSecurityGroupIngress and
#                     ec2:RevokeSecurityGroupIngress on the web security group.
#                     See "Self-authorizing SSH" below for why this is needed.
# Optional:
#   DEPLOY_SSH_PORT   defaults to 22
#   DEPLOY_APP_DIR    tree on the box            defaults to /home/ec2-user/app
#   AWS_REGION        defaults to ap-south-1
#   DEPLOY_SG_ID      web security group         defaults to sg-039bff1f68a7422e5
#
# NOTE ON .env: the box owns its own ~/app/.env. This workflow never writes it,
# so production secrets stay on the box and out of CI.

on:
  push:
    branches: [deploy/aws]
  workflow_dispatch:

concurrency:
  # Two deploys at once fight over the Docker build and the blue/green state
  # file. Queue them instead of cancelling — a half-finished deploy is worse
  # than a slow one.
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail loudly when the deploy isn't configured. This job used to "succeed"
      # in 6 seconds with only a ::warning:: when the secrets were absent, so the
      # branch looked green while nothing had shipped for weeks. A deploy that
      # does nothing must be RED.
      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_SSH_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_SSH_USER"
          [ -n "$KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Auto-deploy is not configured. Missing repo secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      # The box holds a plain source tree (NOT a git checkout), so we ship the
      # tree rather than pulling on the far side.
      # NOTE: next-env.d.ts is deliberately NOT listed. Next generates it and it is
      # gitignored, so it does not exist in a fresh CI checkout - listing it made
      # tar exit 2 and killed the whole deploy. `next build` recreates it inside
      # the image.
      - name: Package the tree
        run: |
          tar czf app.tgz \
            --exclude='node_modules' --exclude='.next' --exclude='.git' \
            src public drizzle scripts certs \
            package.json package-lock.json next.config.ts tsconfig.json \
            drizzle.config.ts postcss.config.js tailwind.config.ts \
            vitest.config.ts
          ls -lh app.tgz

      # ── Self-authorizing SSH ──────────────────────────────────────

      # The box keeps port 22 CLOSED at rest: terraform pins the security group

      # to a single `ssh_cidr` (one developer IP). GitHub-hosted runners draw

      # from thousands of dynamic ranges, so no fixed CIDR can ever cover them —

      # which is why every deploy before this one died at the copy step with

      # "dial tcp <host>:22: i/o timeout", and why this workflow had never once

      # succeeded.

      #

      # Rather than leave 22 open to the internet, the runner grants ITSELF a

      # /32 for the duration of the deploy and hands it back in a step that

      # always runs — including on failure or cancellation.

      - name: Authorize this runner for SSH
        id: sshopen
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          SG_ID: ${{ secrets.DEPLOY_SG_ID || 'sg-039bff1f68a7422e5' }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Cannot open SSH. Add repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
            exit 1
          fi
          IP="$(curl -fsS --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner ip: $IP  ->  sg $SG_ID"
          echo "ip=$IP"    >> "$GITHUB_OUTPUT"
          echo "sg=$SG_ID" >> "$GITHUB_OUTPUT"
          # Deliberately one line: a trailing backslash plus a CR (Windows
          # checkout) escapes the CR, not the newline, and the command splits.
          if aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$IP/32" 2>/tmp/authz.err; then
            echo "opened 22 for $IP/32"
          elif grep -q "InvalidPermission.Duplicate" /tmp/authz.err; then
            echo "rule already present - reusing it"
          else
            cat /tmp/authz.err
            if grep -q "UnauthorizedOperation" /tmp/authz.err; then
              echo "::error::The github-deploy IAM user has no policy allowing ec2:AuthorizeSecurityGroupIngress. Create the user, ATTACH the github-deploy policy to it (IAM > Users > github-deploy > Add permissions > Attach policies directly), then re-run."
            else
              echo "::error::Could not open port 22 on $SG_ID - see the AWS error above."
            fi
            exit 1
          fi

      - name: Copy to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # Workspace-relative, NOT /tmp: scp-action runs in its own container
          # which mounts $GITHUB_WORKSPACE but not the runner's /tmp, so a file
          # written to /tmp is invisible to it and it uploads an empty archive.
          source: app.tgz
          target: /tmp

      - name: Deploy (blue-green) and wait for the result
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR || '/home/ec2-user/app' }}"
            cd "$APP_DIR"

            # A tarball only ADDS files. Anything deleted in git must be deleted
            # here too, or removed code keeps shipping. Snapshot, extract, then
            # drop paths that are no longer in the tarball.
            tar tzf /tmp/app.tgz | sed 's#/$##' | sort -u > /tmp/shipped.txt
            tar xzf /tmp/app.tgz -C "$APP_DIR"
            find src scripts -type f 2>/dev/null | sort -u > /tmp/onbox.txt
            comm -13 /tmp/shipped.txt /tmp/onbox.txt | while read -r stale; do
              [ -n "$stale" ] && rm -f "$stale" && echo "removed stale: $stale"
            done

            # Refresh the deploy script itself from the shipped tree. Without
            # this the box keeps whatever ~/run-deploy.sh was installed by hand,
            # so edits to scripts/run-deploy-bluegreen.sh in git never take
            # effect and you end up debugging a file the box never runs.
            #
            # Strip CR first: a Windows checkout can carry CRLF, and bash rejects
            # a CRLF script with the opaque "syntax error: unexpected end of
            # file" BEFORE executing a single line — indistinguishable from the
            # deploy silently doing nothing. (.gitattributes pins *.sh to LF;
            # this is the belt to that braces.)
            sed -i 's/\r$//' scripts/run-deploy-bluegreen.sh
            install -m 755 scripts/run-deploy-bluegreen.sh ~/run-deploy.sh
            bash -n ~/run-deploy.sh || { echo "::error::~/run-deploy.sh does not parse"; exit 1; }

            # Run detached: the SSH session must not own a 20-minute build.
            rm -f ~/deploy-current.log
            nohup bash ~/run-deploy.sh > ~/deploy-current.log 2>&1 &

            # Poll for the terminal marker the script writes.
            for _ in $(seq 1 240); do
              grep -aq "DEPLOY_DONE_EXIT" ~/deploy-current.log 2>/dev/null && break
              sleep 10
            done

            grep -aE "^=== |DEPLOY_DONE_EXIT" ~/deploy-current.log || true
            code=$(grep -ao "DEPLOY_DONE_EXIT=[0-9]*" ~/deploy-current.log | tail -1 | cut -d= -f2)
            if [ "${code:-}" != "0" ]; then
              echo "::error::Deploy failed (DEPLOY_DONE_EXIT=${code:-timeout}). The previous colour is still serving."
              tail -80 ~/deploy-current.log
              exit 1
            fi
            echo "Deploy OK — active colour: $(cat ~/app/.active-color 2>/dev/null || echo unknown)"

      # Hand the /32 back. `always()` so a failed build, a failed health check
      # or a cancelled run cannot leave the port open behind us.
      - name: Revoke this runner's SSH access
        if: always() && steps.sshopen.outputs.ip != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          IP="${{ steps.sshopen.outputs.ip }}"
          SG="${{ steps.sshopen.outputs.sg }}"
          if aws ec2 revoke-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr "$IP/32"; then
            echo "revoked $IP/32"
          else
            echo "::warning::Could not revoke $IP/32 from $SG - remove it by hand."
          fi
